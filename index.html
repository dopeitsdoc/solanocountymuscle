<!DOCTYPE html>
<html>
<head>
    <title>Solano County Muscle</title>
    <style>
        body {
            display: flex; 
            flex-direction: column; /* Stacks items vertically */
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #000000; 
            color: #ffffff; /* Makes text white */
            font-family: sans-serif;
            text-align: left;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        ul {
            list-style-type: disc;
            line-height: 1.6;
        }
        img {
            display: block;
            margin: 0 auto 30px auto; /* Centers logo and adds space below */
            max-width: 300px;
            height: auto;
        }

        /* Social Links Bar */
        .scm-social-container {
            margin-bottom: 35px;
            text-align: center;
        }
        .scm-social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .social-card:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .social-card.youtube {
            background-color: #ff0000;
        }
        .social-card.instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
        }
        .icon-wrap {
            display: flex;
            align-items: center;
        }
        .social-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .social-info .platform {
            font-size: 13px;
            font-weight: bold;
            line-height: 1.2;
        }
        .social-info .handle {
            font-size: 11px;
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="SMC-Logo.jpeg" alt="SCM">
