<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solano County Muscle</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: left;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
        }

        /* Top Logo */
        .main-logo {
            display: block;
            margin: 10px auto 25px auto;
            max-width: 240px;
            width: 70%;
            height: auto;
        }

        /* Event Images */
        .event-img {
            display: block;
            margin: 12px auto 25px auto;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        /* Social Media Container */
        .scm-social-container {
            margin: 0 auto 30px auto;
            width: 100%;
        }

        .scm-social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            color: #ffffff;
            flex: 1 1 220px; /* Expands nicely, wraps on small screens */
            max-width: 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
        }

        .social-card:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .social-card:active {
            transform: scale(0.98);
        }

        .social-card.youtube {
            background-color: #ff0000;
        }

        .social-card.instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
        }

        .icon-wrap {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .social-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .social-info .platform {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }

        .social-info .handle {
            font-size: 12px;
            opacity: 0.95;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Section Title & Events */
        h2 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            border-bottom: 2px solid #222;
            padding-bottom: 8px;
        }

        ul {
            list-style-type: none; /* Removed default bullets for cleaner card-like layout */
            padding-left: 0;
            margin: 0;
        }

        li {
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 6px;
            line-height: 1.4;
            color: #f0f0f0;
        }

        /* Optional image link hover */
        a img.event-img {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        a img.event-img:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="SMC-Logo.jpeg" alt="Solano County Muscle Logo" class="main-logo">

        <!-- Social Media Buttons -->
        <div class="scm-social-container">
            <div class="scm-social-links">
                <!-- YouTube -->
                <a href="https://www.youtube.com/@solano_county_muscle_cc" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="social-card youtube" 
                   aria-label="Solano County Muscle on YouTube">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.5 12 3.5 12 3.5s-7.505 0-9.377.55a3.016 3.016 0 0 0-2.122 2.136C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.55 9.376.55 9.376.55s7.505 0 9.377-.55a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                    <div class="social-info">
                        <span class="platform">YouTube</span>
                        <span class="handle">@solano_county_muscle_cc</span>
                    </div>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/solano_county_muscle_cc/" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="social-card instagram" 
                   aria-label="Solano County Muscle on Instagram">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                        </svg>
                    </div>
                    <div class="social-info">
                        <span class="platform">Instagram</span>
                        <span class="handle">@solano_county_muscle_cc</span>
                    </div>
                </a>
            </div>
        </div>

        <!-- Upcoming Events -->
        <h2>Upcoming Events</h2>
        <ul>
            <li>10/9 - @Mr_build_ur_shit featured on Autotopia LA</li>
            <a href="https://www.youtube.com/@solano_county_muscle_cc" target="_blank" rel="noopener noreferrer">
                <img src="SCM-AUTOTOPIA.PNG" alt="Autotopia LA Feature" class="event-img">
            </a>

            <li>12/5 - Toy Drive, Vacaville</li>
            <img src="SCM-TD.JPG" alt="Toy Drive Vacaville" class="event-img">

            <li>10/24 - Trunk or Treat Vacaville</li>
            <img src="SCM-TOT.JPG" alt="Trunk or Treat Vacaville" class="event-img">

            <li>09/12 - Downtown Shakedown, Vacaville</li>
            <img src="SCM-SD.jpeg" alt="Downtown Shakedown Vacaville" class="event-img">

            <li>08/29 - 1st Annual Car Show, San Quentin</li>
            <img src="SCM-SQ.jpeg" alt="San Quentin Car Show" class="event-img">
        </ul>
    </div>

</body>
</html>
